if(base===undefined){base=el.getAttribute('aria-label')||'';el.dataset.ccFestiveBase=base}
var pending=a.some(function(o){return o.status==='new'});
var label=base+(a.length?', '+a.length+' festive order'+(a.length===1?'':'s')+(pending?', staff confirmation needed':''):'');
if(el.getAttribute('aria-label')!==label)el.setAttribute('aria-label',label);
if(year){el.classList.toggle('cc-festive-yday',!!a.length);if(a.length)el.title=a.length+' festive orders'}
}
function render(){
queued=false;var m=main(),s=api();if(!m||!s)return;
var d=s.data&&s.data();
if(!loading&&(!d||Date.now()-last>120000)&&typeof s.reload==='function'){
loading=true;last=Date.now();
Promise.resolve().then(function(){return s.reload()}).then(function(){loading=false;queue()},function(){loading=false});
}
var all=allOrders(),shown={};
m.querySelectorAll('.ccs-mday[data-v]').forEach(function(btn){
var date=btn.getAttribute('data-v');if(!/^\d{4}-\d\d-\d\d$/.test(date||''))return;
shown[date]=true;annotate(btn,dayOrders(all,date),false);
var cell=btn.closest('.ccs-mcell');if(cell)makeList(cell,all,date,true);
});
m.querySelectorAll('.ccs-yday[data-v],.ccs-whead[data-v],.ccs-wday-date[data-v]').forEach(function(btn){
var date=btn.getAttribute('data-v');if(!/^\d{4}-\d\d-\d\d$/.test(date||''))return;
shown[date]=true;annotate(btn,dayOrders(all,date),btn.classList.contains('ccs-yday'));
var section=btn.closest('.ccs-wday');
if(section){var head=section.querySelector('.ccs-wday-head');if(head){var host=section.querySelector(':scope > .cc-festive-week-host');if(!host){host=document.createElement('div');host.className='cc-festive-week-host';head.insertAdjacentElement('afterend',host)}makeList(host,all,date,false)}}
});
var day=m.querySelector('.ccs-dayv'),dayDate=day&&dayFromTitle((m.querySelector('.ccs-caltitle')||{}).textContent);
if(dayDate){shown[dayDate]=true;var host=day.querySelector(':scope > .cc-festive-day-host');if(!host){host=document.createElement('div');host.className='cc-festive-day-host';var anchor=day.querySelector('.ccs-daytot');if(anchor)anchor.insertAdjacentElement('afterend',host);else day.prepend(host)}makeList(host,all,dayDate,false)}
var hits=all.filter(function(o){return shown[o.pickup_date]}),bar=m.querySelector('.ccs-calbar'),box=m.querySelector('.cc-festive-cal-summary');
if(!hits.length||!bar){if(box)box.remove();return}
if(!box){box=document.createElement('div');box.className='cc-festive-cal-summary';box.setAttribute('role','status');bar.insertAdjacentElement('afterend',box)}
var waiting=hits.filter(function(o){return o.status==='new'}).length,summary='🎄 '+hits.length+' festive order'+(hits.length===1?'':'s')+' shown'+(waiting?' · '+waiting+' date'+(waiting===1?'':'s')+' awaiting staff confirmation':'');
if(box.dataset.summary!==summary){box.innerHTML='<p></p><button type="button" data-cc-festive-open="1">View seasonal orders</button>';box.querySelector('p').textContent=summary;box.dataset.summary=summary}
box.querySelector('button').dataset.ccFestiveView=hits.some(function(o){return o.status==='new'})?'today':hits.some(function(o){return o.status==='confirmed'&&o.pickup_date>=today()})?'later':'past';
}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Pacific/Fiji'}).format(new Date())}
function viewFor(o){return o.status==='new'?'today':o.status==='confirmed'?(o.pickup_date>today()?'later':'today'):'past'}
function openBoard(view){var s=api();if(s&&s.open)s.open(view||'today')}
function focusOrder(o){
var s=api();if(!s||!s.open)return;
var root=document.getElementById('cc-staff'),id=String(o.id),observer,interval,timeout,finished=false;
function stop(){if(finished)return;finished=true;if(observer)observer.disconnect();if(interval)clearInterval(interval);if(timeout)clearTimeout(timeout)}
function locate(){if(finished)return;var board=document.getElementById('cc-to');if(!board)return;
var cards=board.querySelectorAll('.cc-to-o[data-id]'),card=null;
for(var i=0;i<cards.length;i++){if(cards[i].getAttribute('data-id')===id){card=cards[i];break}}
if(!card)return;
var more=card.querySelector('[data-cc-to="more"]');
stop();if(more&&more.getAttribute('aria-expanded')!=='true')more.click();
requestAnimationFrame(function(){
var cards=document.querySelectorAll('#cc-to .cc-to-o[data-id]');
for(var j=0;j<cards.length;j++)if(cards[j].getAttribute('data-id')===id){cards[j].classList.add('cc-festive-focused');cards[j].scrollIntoView({block:'center',behavior:'auto'});var b=cards[j].querySelector('[data-cc-to="more"]');if(b)b.focus({preventScroll:true});break}
});
}
observer=new MutationObserver(locate);observer.observe(root,{childList:true,subtree:true});
interval=setInterval(locate,150);timeout=setTimeout(stop,9000);s.open(viewFor(o));locate();
}
function queue(){if(queued)return;queued=true;requestAnimationFrame(render)}
function start(){
var root=document.getElementById('cc-staff');if(!root)return setTimeout(start,300);
root.addEventListener('click',function(e){
var b=e.target&&e.target.closest&&e.target.closest('[data-cc-festive-order],[data-cc-festive-open],[data-cc-festive-day]');
if(!b)return;e.preventDefault();e.stopPropagation();
var id=b.dataset.ccFestiveOrder,all=allOrders(),o=all.find(function(x){return String(x.id)===id});
if(id&&o)focusOrder(o);
else if(b.dataset.ccFestiveDay){var day=b.dataset.ccFestiveDay,match=all.find(function(x){return x.pickup_date===day});openBoard(match?viewFor(match):'today')}
else openBoard(b.dataset.ccFestiveView||'today');
},true);
new MutationObserver(function(list){if(list.some(function(v){
var el=v.target&&v.target.nodeType===1?v.target:v.target&&v.target.parentElement;
return el&&!el.closest('.cc-festive-cal-summary,.cc-festive-cal-list,.cc-festive-week-host,.cc-festive-day-host,#cc-to');
}))queue()}).observe(root,{childList:true,subtree:true});
setInterval(function(){if(main())queue()},20000);queue();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
