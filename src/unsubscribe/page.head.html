<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
body{margin:0;background:#FFFFFF}
.ccu{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:#FFFFFF;font-family:"Figtree",Arial,sans-serif;color:#46403A}
.ccu *{box-sizing:border-box}
.ccu-card{width:100%;max-width:460px;text-align:center}
.ccu-logo{display:block;width:150px;height:auto;margin:0 auto 28px}
.ccu h1{margin:0 0 12px;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;color:#24211D}
.ccu p{margin:0 0 14px;font-size:17px;line-height:1.55}
.ccu h1:focus{outline:0}
.ccu .ccu-small{font-size:15px;color:#6B645D}
.ccu-btn{appearance:none;border:0;border-radius:12px;background:#5F7A4A;color:#FFFFFF;font:600 17px "Figtree",Arial,sans-serif;min-height:52px;padding:14px 28px;margin:10px 0 16px;cursor:pointer;width:100%;max-width:300px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.ccu-btn:hover{background:#46603A}
.ccu-btn:disabled{opacity:.65;cursor:progress}
.ccu-btn:focus-visible,.ccu a:focus-visible{outline:3px solid rgba(95,122,74,.5);outline-offset:3px}
.ccu a{color:#46603A;font-weight:600}
.ccu-spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:ccu-spin .8s linear infinite}
@keyframes ccu-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ccu-spin{animation:none}}
</style>
