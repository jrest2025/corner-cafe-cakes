<style>
/* 28 Oct 2026: festive orders are placed right here; the goodie cards are the picker, the box below is the order */
#festive-order{display:none!important}
#festive-menu .ccfest-wine-offer .ccfest-btn{display:none!important}
/* Order buttons wait for the On/Off switch (Service Hub > Settings > Seasonal items) before they show */
html:not(.ccfest-known) #festive-menu .ccfest-card-add,html:not(.ccfest-known) .ccfest-order-link{visibility:hidden}
.ccfest-treats{padding:0 0 64px;overflow-x:clip}.ccfest-treats #cc-treat-order{scroll-margin-top:90px}
.ccfest-soon{display:inline-flex;align-items:center;min-height:44px;font-size:15px;color:#566358;font-style:italic}
/* the card's own Webflow button (ccfest-btn ccfest-btn-primary), a little smaller to sit beside the price */
#festive-menu .ccfest-card-add.ccfest-btn{min-height:48px;padding:10px 22px;color:#fff;text-decoration:none;cursor:pointer}
#festive-menu .ccfest-card-add.ccfest-btn:hover{color:#fff}
#festive-menu .ccfest-card.is-in-order{border-color:#163E32;box-shadow:0 0 0 1px #163E32}
.ccfest-qty{display:inline-flex;align-items:center;gap:6px}
.ccfest-qty[hidden]{display:none}
.ccfest-qty button{width:48px;height:48px;border-radius:4px;border:1px solid #163E32;background:#fff;color:#163E32;font-family:inherit;font-size:22px;font-weight:600;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ccfest-qty button:hover:not(:disabled){background:#F3F5F1}
.ccfest-qty button:disabled{opacity:.4;cursor:not-allowed}
.ccfest-qty button:focus-visible,.ccfest-bar .ccfest-btn:focus-visible{outline:3px solid #163E32;outline-offset:2px}
.ccfest-qty output{min-width:28px;text-align:center;font-weight:600;font-size:18px;color:#163E32}
.ccfest-off{flex-basis:100%;margin:0;font-size:14px;font-style:italic;color:#9a4b12}
/* "in your order" bar: shows while goodies are chosen and the order box is out of view */
.ccfest-bar{position:fixed;left:50%;bottom:14px;z-index:50;transform:translate(-50%,0);width:min(560px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;background:#fff;border:1px solid #E8E1D5;border-radius:8px;box-shadow:0 8px 28px rgba(22,62,50,.18);color:#26352D;font-size:16px;transition:opacity .16s ease-out,transform .16s ease-out}
.ccfest-bar[hidden]{display:flex;opacity:0;pointer-events:none;transform:translate(-50%,12px)}
.ccfest-bar b{color:#163E32}
.ccfest-bar .ccfest-btn{min-height:48px;padding:10px 18px;cursor:pointer;white-space:nowrap}
@media(prefers-reduced-motion:reduce){.ccfest-bar{transition:none}}
</style>
<script>
/* 28 Oct 2026: the order box sits right after the goodies; data-cct-cards tells the order module the cards are the picker */
(function(){var m=document.getElementById('festive-menu');if(!m||document.getElementById('cc-treat-host'))return;
var s=document.createElement('section');s.className='ccfest-treats';s.innerHTML='<div class="ccfest-shell"><div id="cc-treat-host" data-cct-cards></div></div>';m.parentNode.insertBefore(s,m.nextSibling);})();
</script>
<script>
/* Festive menu from the Webflow CMS (Festive Goodies). 28 October 2026.
   Edit names, prices, wording, photos and order in the Webflow CMS. Card names must match the item names in the
   Service Hub (Settings > Seasonal items), so Add puts the right goodie in the order.
   One switch: when the Festive treats heading is On in the Service Hub, each card has Add (then − 1 +) and the order
   box below collects the goodies; when it is Off, the cards say "Coming soon" and nothing links to ordering. */
document.addEventListener('DOMContentLoaded',function(){
  var menu=document.getElementById('festive-menu'); if(!menu)return;
  [].slice.call(menu.querySelectorAll('.w-dyn-items')).forEach(function(list){
    var items=[].slice.call(list.children), n=function(el){var s=el.querySelector('[data-festive-sort]');var v=parseFloat(s&&s.textContent);return isNaN(v)?9999:v;};
    items.sort(function(a,b){return n(a)-n(b);}).forEach(function(i){list.appendChild(i);});
  });
  var txt=function(c,sel){var e=c.querySelector(sel);return e?e.textContent.replace(/\s+/g,' ').trim():'';};
  var cards=[].slice.call(menu.querySelectorAll('.ccfest-card'));
  cards.forEach(function(c){
    var img=c.querySelector('img'), src=img&&img.getAttribute('src')||'';
    if(!src||/placeholder/i.test(src))c.classList.add('is-nophoto');
    var note=c.querySelector('.ccfest-card-note'); if(note&&!note.textContent.trim())note.style.display='none';
  });
  var orderLinks=[].slice.call(document.querySelectorAll('a[href="#festive-order"],a[href="/order-cake#cc-treat-order"],a[href="#cc-treat-order"]')).filter(function(a){return !a.classList.contains('ccfest-card-add');});
  /* wine is counter only ("ask our team when you collect"), so its enquiry button is not shown */
  orderLinks=orderLinks.filter(function(a){if(/wine/i.test(a.textContent)){a.style.display='none';return false;}return true;});
  orderLinks.forEach(function(a){a.classList.add('ccfest-order-link');});
  var S=function(){return window.__ccoSeasonal;}, isOn=false;
  function soonOn(c,add){var soon=c.querySelector('.ccfest-soon');if(!soon){soon=document.createElement('span');soon.className='ccfest-soon';soon.textContent='Coming soon';add.parentNode.insertBefore(soon,add);}}
  /* each card: Add (the card's own Webflow button), or − 1 + once it is in the order */
  function sync(){
    cards.forEach(function(c){
      var name=txt(c,'.ccfest-card-title'), add=c.querySelector('.ccfest-card-add'); if(!add||!name)return;
      var info=isOn&&S()&&S().info?S().info(name):null, qty=c.querySelector('.ccfest-qty'), off=c.querySelector('.ccfest-off');
      if(!info){add.style.display='none';if(qty)qty.hidden=true;c.classList.remove('is-in-order');if(isOn&&S()&&S().menu&&S().menu())soonOn(c,add);return;}
      var soon=c.querySelector('.ccfest-soon');if(soon)soon.remove();
      if(!qty){qty=document.createElement('div');qty.className='ccfest-qty';qty.setAttribute('role','group');qty.setAttribute('aria-label',name+' quantity');
        qty.innerHTML='<button type="button" data-q="-1"></button><output aria-live="polite"></output><button type="button" data-q="1">+</button>';
        qty.querySelector('[data-q="-1"]').setAttribute('aria-label','Remove one '+name);qty.querySelector('[data-q="1"]').setAttribute('aria-label','Add one '+name);
        qty.querySelector('[data-q="-1"]').textContent='−';qty.setAttribute('data-name',name);add.parentNode.insertBefore(qty,add.nextSibling);}
      add.classList.add('ccfest-btn','ccfest-btn-primary');add.removeAttribute('href');add.setAttribute('role','button');add.setAttribute('tabindex','0');
      add.textContent='Add';add.setAttribute('aria-label','Add '+name);add.setAttribute('data-treat',name);
      add.style.display=info.q?'none':'';qty.hidden=!info.q;c.classList.toggle('is-in-order',!!info.q);
      qty.querySelector('output').textContent=info.q;qty.querySelector('[data-q="1"]').disabled=info.q>=info.max;
      var msg=info.off&&!info.q?info.off:'';
      if(msg){if(!off){off=document.createElement('p');off.className='ccfest-off';add.parentNode.appendChild(off);}off.textContent=msg;}else if(off)off.remove();
    });
    bar();
  }
  /* "2 goodies · $47  View order" while the order box is off screen */
  var barEl=null, boxSeen=false;
  function bar(){
    var s=S(), n=isOn&&s&&s.count?s.count():0;
    if(!barEl){if(!n)return;barEl=document.createElement('div');barEl.className='ccfest-bar';barEl.hidden=true;barEl.setAttribute('role','region');barEl.setAttribute('aria-label','Your festive order');
      barEl.innerHTML='<span></span><button type="button" class="ccfest-btn ccfest-btn-primary">View order</button>';(menu.closest('.ccfest')||document.body).appendChild(barEl);
      barEl.querySelector('button').addEventListener('click',function(){var o=document.getElementById('cc-treat-order');if(o)o.scrollIntoView({block:'start'});var f=o&&o.querySelector('button:not(:disabled)');if(f)f.focus({preventScroll:true});});
      var o=document.getElementById('cc-treat-order');
      if(o&&'IntersectionObserver' in window)new IntersectionObserver(function(e){boxSeen=e[0].isIntersecting;bar();}).observe(o);}
    var t=s&&s.total?s.total():0, sp=barEl.querySelector('span'), h='<b>'+n+' goodie'+(n===1?'':'s')+'</b> · '+(s&&s.money?s.money(t):'$'+t);
    if(sp.innerHTML!==h)sp.innerHTML=h;
    barEl.hidden=!n||boxSeen;
  }
  function apply(on){
    isOn=on;
    cards.forEach(function(c){
      var add=c.querySelector('.ccfest-card-add'); if(!add)return;
      if(!on){add.style.display='none';soonOn(c,add);}
    });
    /* hero "Order festive treats" goes to the goodies, where ordering starts */
    orderLinks.forEach(function(a){if(on){a.style.display='';a.setAttribute('href','#festive-menu');}else a.style.display='none';});
    if(on)sync();
    document.documentElement.classList.add('ccfest-known');
  }
  window.addEventListener('cct:change',function(){if(isOn)sync();});
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest&&e.target.closest('#festive-menu [data-treat],#festive-menu .ccfest-qty button'); if(!t||!S()||!S().set)return;
    e.preventDefault();
    var kb=e.detail===0;
    if(t.hasAttribute('data-treat')){var nm=t.getAttribute('data-treat');if(S().set(nm,1)&&kb){var q=t.parentNode.querySelector('.ccfest-qty [data-q="1"]');if(q)q.focus({preventScroll:true});}return;}
    var box=t.closest('.ccfest-qty'), name=box.getAttribute('data-name'), i=S().info(name); if(!i)return;
    S().set(name,i.q+(+t.getAttribute('data-q')));
    if(kb&&!S().info(name).q){var a=box.parentNode.querySelector('.ccfest-card-add');if(a)a.focus({preventScroll:true});}
  });
  document.addEventListener('keydown',function(e){var t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.matches&&t.matches('#festive-menu [data-treat]')){e.preventDefault();t.click();}});
  var done=false; function once(on){if(done)return;done=true;apply(on);}
  setTimeout(function(){once(true);},6000);   /* no answer: allow ordering; the order box checks the menu itself */
  try{
    fetch('https://ilbrfwxblhidtlsjgxlh.supabase.co/rest/v1/rpc/get_seasonal_menu',{method:'POST',headers:{'Content-Type':'application/json',apikey:'sb_publishable_4c9NdubC5PYevEOSMYH0ag_mv1LJ76E'},body:JSON.stringify({p_channel:'website'})})
      .then(function(r){return r.ok?r.json():null;}).then(function(m){once(!m||!m.ok?true:(m.groups||[]).length>0);},function(){once(true);});
  }catch(e){once(true);}
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/jrest2025/corner-cafe-cakes@b1ae12c1958f67603bf43ce33b1eeccb12b741b1/src/guest.seasonal.js" integrity="sha384-8HfslIlFRxwiTujOssMeaZn0rb3/3NU+HRZjec2EszQjzjNrXgwFIV8sZYtuY6i+" crossorigin="anonymous"></script>
