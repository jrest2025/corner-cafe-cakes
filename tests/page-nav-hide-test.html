<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../guest.css"><style>html{scroll-behavior:smooth}body{margin:0;background:#fff}</style></head>
<body><header id="site-nav" style="position:sticky;top:0;z-index:40;height:72px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 16px;font:600 18px Arial">Corner Café (test menu bar)</header><section class="cco-page"><div class="cco-intro"><p class="cco-kicker">Celebration cakes</p><h1 class="cco-h1">Order your cake.</h1><p class="cco-lead">Choose your cake, tell us how you'd like it, and pick a collection time. We'll confirm it with you before anything is booked.</p></div><div id="cc-cake-order"></div><p class="cco-help">Prefer to talk it through? Call us on +679 892 2760.</p></section>
<script>(function(){var h=document.getElementById('site-nav');h.style.transition='transform .26s';var y=0;addEventListener('scroll',function(){var n=pageYOffset;if(n>y+2&&n>80)h.style.transform='translateY(-100%)';else if(n<y-2)h.style.transform='none';y=n;},{passive:true});})();</script><script src="mock.js"></script>
<script>
window.__sent = [];
window.__ccoMock = {
  rpc: function (fn, a) {
    if (fn === 'get_order_setup') return window.__ccsMock.rpc(fn, a);
    window.__sent.push(a.p);
    if (window.__sent.length === 1) return Promise.resolve({ data: { ok: false, error: 'date', field: 'date', message: 'This cake needs 2 days’ notice. The earliest date is Monday 12 October.' } });
    return Promise.resolve({ data: { ok: true, reference: 'CC-1010', status: 'awaiting_review' } });
  },
  storage: { from: function () { return { upload: function () { return Promise.resolve({ data: {} }); } }; } }
};
</script>
<script src="../guest.js"></script>
