<body><div id="cc-cake-order"></div>

<script>
window.__sent = [];
window.__ccoMock = {
  rpc: function (fn, a) {
    if (fn === 'get_order_setup') return window.__ccsMock.rpc(fn, a);
    window.__sent.push(a.p);
    if (window.__sent.length === 1) return Promise.resolve({ data: { ok: false, error: 'date', field: 'date', message: 'This cake needs 2 days’ notice. The earliest date is Monday 12 October.' } });
    return Promise.resolve({ data: { ok: true, reference: 'CC-1010', status: 'awaiting_review' } });
  },
  storage: { from: function () { return { upload: function () { return Promise.resolve({ data: {} }); } }; } }
};
</script>
